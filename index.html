<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CHICAGO</title>

<link rel="icon" type="image/png" href="/icons8-cards-16.png">

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    min-height: 100%;
    background: #0d0b0a;
    color: #e8e0d8;
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    overflow-x: hidden;
}

button, input {
    font-family: inherit;
    outline: none;
    border: none;
}

:root {
    --gold: #c9a84c;
    --gold-dark: #a8893a;
    --gold-glow: rgba(201,168,76,.2);
    --red: #8b1a1a;
    --red-bright: #c0392b;
    --bg-main: #0d0b0a;
    --bg-card: #1a1715;
    --border: #2c2824;
    --text-primary: #e8e0d8;
    --text-secondary: #a89888;
    --text-muted: #6a6258;
    --shadow: 0 2px 12px rgba(0,0,0,.4);
}

.screen {
    min-height: 100vh;
    padding: 16px 12px 20px;
    position: relative;
    background: var(--bg-main);
}

/* ============================================================
   GEMENSAMMA KNAPPAR
   ============================================================ */

.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 12px 28px;
    border-radius: 6px;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: .5px;
    color: #1a1a1a;
    background: linear-gradient(180deg,var(--gold),var(--gold-dark));
    border: 1px solid var(--gold);
    transition: all .2s ease;
    cursor: pointer;
    min-height: 46px;
    min-width: 140px;
    touch-action: manipulation;
    box-shadow: 0 2px 10px var(--gold-glow);
}

.btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 20px var(--gold-glow);

}

.start-game-btn {
    margin-top: 12px;

}

.btn:active {
    transform: scale(.96);
}

/* ============================================================
   HÖRNESKNAPPAR - Q&A + HELSKÄRM
   ============================================================ */

.corner-tools {
    position: fixed;
    top: 10px;
    right: 10px;
    z-index: 900;
    display: flex;
    gap: 6px;
}

.corner-btn {
    width: 38px;
    height: 38px;
    min-width: 38px;
    min-height: 38px;
    padding: 0;
    border-radius: 50%;
    background: rgba(26,23,21,.94);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 10px rgba(0,0,0,.4);
}

.corner-btn:hover,
.corner-btn:active {
    color: var(--gold);
    border-color: var(--gold);
}

/* ============================================================
   START
   ============================================================ */

.start-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding-top: 40px;
}

.start-title {
    font-size: 44px;
    font-weight: 300;
    letter-spacing: 12px;
    color: var(--gold);
}

.start-subtitle {
    font-size: 10px;
    letter-spacing: 4px;
    color: var(--text-muted);
    margin-top: 4px;
    margin-bottom: 20px;
    text-transform: uppercase;
}

.connection-status {
    font-size: 10px;
    letter-spacing: 1.5px;
    margin-bottom: 16px;
}

.connection-status.connected {
    color: #4a9e6a;
}

.connection-status.disconnected {
    color: var(--red-bright);
}

.name-frame {
    width: 100%;
    max-width: 440px;
    padding: 16px 14px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: var(--shadow);
    margin-bottom: 20px;
}

.name-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 4px 0;
}

.name-row label {
    width: 72px;
    flex-shrink: 0;
    text-align: right;
    font-size: 11px;
    color: var(--text-secondary);
}

.name-row input {
    flex: 1;
    height: 36px;
    padding: 0 12px;
    border-radius: 4px;
    background: #12100e;
    border: 1px solid var(--border);
    color: var(--text-primary);
    font-size: 14px;
}

.name-row input:focus {
    border-color: var(--gold);
}

/* ============================================================
   SPEL
   ============================================================ */

.game-title {
    font-size: 24px;
    font-weight: 300;
    letter-spacing: 8px;
    color: var(--gold);
    text-align: center;
    margin: 6px 0 2px;
    opacity: .7;
}

.round-label {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 2px;
    text-align: center;
    color: var(--text-primary);
    margin-bottom: 4px;
}

.host-label {
    text-align: center;
    font-size: 9px;
    letter-spacing: 1.5px;
    color: var(--gold);
    opacity: .6;
    margin-bottom: 8px;
}

.table-wrapper {
    width: 100%;
    overflow-x: auto;
    padding: 4px 2px;
    display: flex;
    justify-content: center;
    -webkit-overflow-scrolling: touch;
}

.score-table {
    border-collapse: separate;
    border-spacing: 0;
    margin: 0 auto;
    min-width: max-content;
    background: var(--bg-card);
    border-radius: 8px;
    overflow: hidden;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
    width: 100%;
}

.score-table th,
.score-table td {
    padding: 10px 12px;
    text-align: center;
    white-space: nowrap;
    border-bottom: 1px solid rgba(255,255,255,.04);
}

.player-header,
.round-header,
.score-cell,
.round-total-cell,
.total-label {
    min-width: 80px;
}

.player-header,
.round-header {
    font-size: 14px;
    font-weight: 700;
    color: var(--text-primary);
    text-align: center !important;
}

.sub-header {
    display: block;
    font-size: 9px;
    color: var(--text-muted);
    font-weight: 400;
}

.score-frame {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    height: 44px;
}

.score-btn {
    width: 42px;
    min-width: 42px;
    height: 42px;
    padding: 0;
    border-radius: 4px;
    background: rgba(255,255,255,.06);
    border: 1px solid var(--border);
    color: var(--text-primary);
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
}

.score-btn:hover {
    background: var(--gold);
    border-color: var(--gold);
    color: #1a1a1a;
}

.score-slash {
    color: var(--text-muted);
}

.total-row td {
    background: rgba(201,168,76,.08);
    border-top: 2px solid rgba(201,168,76,.15);
    padding: 14px 12px;
}

.total-label,
.round-total-cell {
    color: var(--gold);
    font-weight: 700;
}

.round-total-cell {
    font-size: 18px;
}

.current-round-row td {
    background: rgba(192,57,43,.06);
}

.bottom-frame {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 14px;
    width: 100%;
    padding: 18px 8px 4px;
}

/* ============================================================
   BANNER
   ============================================================ */

.banner-container {
    position: fixed;
    top: 58px;
    left: 12px;
    right: 12px;
    z-index: 2000;
    display: flex;
    justify-content: center;
    pointer-events: none;
}

.banner {
    width: 100%;
    max-width: 460px;
    padding: 12px 15px;
    background: rgba(26,23,21,.97);
    border: 1px solid var(--gold);
    border-radius: 7px;
    box-shadow: 0 8px 30px rgba(0,0,0,.55);
    text-align: center;
    animation: bannerIn .25s ease;
}

.banner-title {
    color: var(--gold);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
}

.banner-message {
    color: var(--text-secondary);
    font-size: 11px;
    margin-top: 3px;
    line-height: 1.4;
}

.banner.hide {
    animation: bannerOut .3s ease forwards;
}

@keyframes bannerIn {
    from {
        opacity: 0;
        transform: translateY(-10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes bannerOut {
    to {
        opacity: 0;
        transform: translateY(-10px);
    }
}

/* ============================================================
   POPUP - ENDAST FÖR SPELPOÄNG / Q&A
   ============================================================ */

.popup-overlay {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 16px;
    background: rgba(0,0,0,.7);
    backdrop-filter: blur(4px);
}

.popup {
    width: 100%;
    max-width: 480px;
    max-height: calc(100vh - 32px);
    overflow-y: auto;
    padding: 20px 18px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 16px 48px rgba(0,0,0,.6);
}

.popup-title {
    text-align: center;
    font-size: 18px;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 12px;
}

.combination-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
}

.combination-btn {
    padding: 10px 6px;
    border-radius: 4px;
    background: rgba(255,255,255,.04);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    font-size: 11px;
    cursor: pointer;
    min-height: 40px;
}

.combination-btn.selected,
.outplay-btn.selected {
    background: linear-gradient(180deg,var(--gold),var(--gold-dark));
    border-color: var(--gold);
    color: #1a1a1a;
}

.outplay-section {
    margin-top: 12px;
    text-align: center;
}

.outplay-btn {
    padding: 8px 20px;
    border-radius: 4px;
    background: rgba(255,255,255,.04);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    cursor: pointer;
    min-height: 36px;
}

.popup-buttons {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 14px;
}

.popup-btn {
    padding: 10px 24px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    min-height: 40px;
}

.popup-btn-save {
    background: linear-gradient(180deg,var(--gold),var(--gold-dark));
    color: #1a1a1a;
}

.popup-btn-cancel {
    background: rgba(255,255,255,.04);
    color: var(--text-secondary);
    border: 1px solid var(--border);
}

/* ============================================================
   FAQ
   ============================================================ */

.faq-content {
    color: var(--text-secondary);
    font-size: 12px;
    line-height: 1.55;
}

.faq-item {
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
}

.faq-item:last-child {
    border-bottom: 0;
}

.faq-question {
    color: var(--gold);
    font-weight: 700;
    margin-bottom: 4px;
}

/* ============================================================
   STATISTIK
   ============================================================ */

.stats-title {
    text-align: center;
    font-size: 32px;
    font-weight: 300;
    letter-spacing: 6px;
    color: var(--gold);
}

.stats-subtitle {
    text-align: center;
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--text-muted);
    margin-bottom: 16px;
}

.stats-list {
    width: 100%;
    max-width: 820px;
    margin: 0 auto;
}

.stats-card {
    margin-bottom: 10px;
    padding: 14px 16px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-left: 3px solid var(--gold);
    border-radius: 6px;
    text-align: center;
}

.stats-player {
    font-size: 20px;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 10px;
}

.stats-grid {
    display: grid;
    grid-template-columns: repeat(4,1fr);
    gap: 6px;
}

.stat-box {
    padding: 8px 4px;
    background: rgba(255,255,255,.03);
    border-radius: 4px;
    min-height: 44px;
}

.stat-number {
    font-size: 18px;
    font-weight: 700;
    color: var(--gold);
}

.stat-label {
    font-size: 9px;
    text-transform: uppercase;
    color: var(--text-secondary);
    margin-top: 2px;
    font-weight: 600;
}

.live-stat {
    border: 1px solid rgba(201,168,76,.15);
    background: rgba(201,168,76,.05);
}

.stats-buttons {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 16px;
}

/* ============================================================
   VINNARE
   ============================================================ */

.winner-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    min-height: 100vh;
    padding: 24px 16px;
}

.winner-title {
    font-size: 40px;
    font-weight: 300;
    color: var(--gold);
}

.winner-name {
    font-size: 28px;
    font-weight: 600;
    margin-top: 12px;
}

.winner-score {
    font-size: 20px;
    font-weight: 700;
    color: var(--gold);
    margin-top: 6px;
}

.winner-message {
    color: var(--text-secondary);
    font-size: 13px;
    margin-top: 6px;
}

.winner-buttons {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 20px;
}

/* ============================================================
   CONFETTI
   ============================================================ */

.confetti {
    position: fixed;
    top: -20px;
    width: 6px;
    height: 10px;
    z-index: 9999;
    pointer-events: none;
    animation: confettiFall linear forwards;
}

@keyframes confettiFall {
    from {
        transform: translateY(0) rotate(0);
        opacity: 1;
    }
    to {
        transform: translateY(110vh) rotate(720deg);
        opacity: 0;
    }
}

/* ============================================================
   MOBIL
   ============================================================ */

@media (max-width:600px) {
    .start-title {
        font-size: 30px;
        letter-spacing: 8px;
    }

    .game-title {
        font-size: 18px;
        letter-spacing: 6px;
    }

    .round-label {
        font-size: 17px;
    }

    .winner-title {
        font-size: 30px;
    }

    .winner-name {
        font-size: 22px;
    }

    .stats-grid {
        grid-template-columns: repeat(2,1fr);
    }

    .stats-player {
        font-size: 17px;
    }

    .combination-grid {
        gap: 4px;
    }

    .combination-btn {
        font-size: 10px;
        padding: 8px 4px;
        min-height: 34px;
    }

    .btn {
        padding: 10px 20px;
        font-size: 13px;
        min-height: 42px;
        min-width: 120px;
    }

    .player-header,
    .round-header,
    .score-cell,
    .round-total-cell,
    .total-label {
        min-width: 60px;
    }

    .score-btn {
        width: 36px;
        min-width: 36px;
        height: 36px;
        font-size: 16px;
    }

    .score-table th,
    .score-table td {
        padding: 8px;
    }
}

@media (max-width:400px) {
    .start-title {
        font-size: 24px;
        letter-spacing: 6px;
    }

    .game-title {
        font-size: 15px;
        letter-spacing: 4px;
    }

    .round-label {
        font-size: 14px;
    }

    .score-btn {
        width: 30px;
        min-width: 30px;
        height: 30px;
        font-size: 14px;
    }

    .player-header,
    .round-header,
    .score-cell,
    .round-total-cell,
    .total-label {
        min-width: 50px;
    }

    .score-table th,
    .score-table td {
        padding: 6px 4px;
    }

    .btn {
        padding: 8px 16px;
        font-size: 12px;
        min-height: 38px;
        min-width: 100px;
    }
}
</style>
</head>

<body>

<div id="app"></div>
<div id="banner-container" class="banner-container"></div>

<script>

/* ============================================================
   SOCKET
   ============================================================ */

const socket = io('https://chicago-9cud.onrender.com');

let connected = false;
let hostId = null;
let roomCode = localStorage.getItem("chicago_room") || null;

const app = document.getElementById("app");
const bannerContainer = document.getElementById("banner-container");

/* ============================================================
   SPEL
   ============================================================ */

const ANTAL_SPELARE = 6;

let players = [];
let scores = {};
let currentRound = 0;
let activePlayerIndex = 0;
let gameStarted = false;
let gameFinished = false;
let statistics = {};
let currentScreen = "start";
let previousWinner = null;

const OUTPLAY_POINTS = 5;

const COMBINATIONS = [
    ["0 poäng",0,"zero"],
    ["Par 1 poäng",1,"par"],
    ["Två par 2 poäng",2,"tvapar"],
    ["Triss 3 poäng",3,"triss"],
    ["Stege 4 poäng",4,"stege"],
    ["Färg 5 poäng",5,"farg"],
    ["Kåk 6 poäng",6,"kak"],
    ["Fyrtal 8 poäng",8,"fyrtal"],
    ["Färgstege 11 poäng",11,"fargstege"],
    ["Royal Flush 20 poäng",20,"royal"],
    ["Chicago +15",15,"chicago_plus"],
    ["Chicago -15",-15,"chicago_minus"]
];

/* ============================================================
   HJÄLP
   ============================================================ */

function isHost() {
    return !!(
        socket.id &&
        hostId &&
        socket.id === hostId
    );
}

function el(tag, cls = "", html = "") {
    const e = document.createElement(tag);

    if (cls) e.className = cls;
    if (html !== "") e.innerHTML = html;

    return e;
}

function button(text, cls, onClick) {
    const b = el("button", `btn ${cls}`, text);

    if (onClick) b.onclick = onClick;

    return b;
}

/* ============================================================
   BANNER
   ============================================================ */

let bannerTimer = null;

function showBanner(title, message, duration = 3500) {

    if (bannerTimer) {
        clearTimeout(bannerTimer);
        bannerTimer = null;
    }

    bannerContainer.innerHTML = "";

    const banner = el("div", "banner");

    banner.appendChild(
        el("div", "banner-title", title)
    );

    banner.appendChild(
        el("div", "banner-message", message)
    );

    bannerContainer.appendChild(banner);

    bannerTimer = setTimeout(() => {

        banner.classList.add("hide");

        setTimeout(() => {
            if (banner.parentNode) {
                banner.remove();
            }
        }, 300);

    }, duration);
}

/* ============================================================
   FAQ
   ============================================================ */

function showFAQ() {

    const overlay = el("div", "popup-overlay");
    const popup = el("div", "popup");

    popup.appendChild(
        el("div", "popup-title", "Q&A")
    );

    const content = el("div", "faq-content");

    const items = [
        [
            "Vad händer om protokollföraren lämnar?",
            "Spelet fortsätter. En kvarvarande spelare utses automatiskt till ny protokollförare."
        ],
        [
            "Vad händer om mobilen eller internet dör?",
            "Spelet ligger kvar på servern. Ett tillfälligt avbrott avslutar inte spelet."
        ],
        [
            "Påverkas statistiken om någon lämnar?",
            "Nej. Pågående spel och sparad statistik ligger kvar."
        ],
        [
            "Vad gör AVBRYT SESSION?",
            "Den här enheten lämnar den aktuella sessionen och går tillbaka till startsidan."
        ]
    ];

    items.forEach(([question, answer]) => {

        const item = el("div", "faq-item");

        item.appendChild(
            el("div", "faq-question", question)
        );

        item.appendChild(
            el("div", "", answer)
        );

        content.appendChild(item);
    });

    popup.appendChild(content);

    const actions = el("div", "popup-buttons");

    const close = el(
        "button",
        "popup-btn popup-btn-save",
        "STÄNG"
    );

    close.onclick = () => {
        overlay.remove();
    };

    actions.appendChild(close);
    popup.appendChild(actions);

    overlay.appendChild(popup);
    document.body.appendChild(overlay);
}

/* ============================================================
   HELSKÄRM
   ============================================================ */

function toggleFullscreen() {

    if (!document.fullscreenElement) {

        if (document.documentElement.requestFullscreen) {
            document.documentElement.requestFullscreen()
                .catch(() => {
                    showBanner(
                        "HELSKÄRM",
                        "Helskärm stöds inte av den här webbläsaren."
                    );
                });
        }

    } else {

        if (document.exitFullscreen) {
            document.exitFullscreen();
        }
    }
}

function createCornerTools() {

    const tools = el("div", "corner-tools");

    const faq = el("button", "corner-btn", "?");
    faq.title = "Q&A";
    faq.onclick = showFAQ;

    const fullscreen = el("button", "corner-btn", "⛶");
    fullscreen.title = "Helskärm";
    fullscreen.onclick = toggleFullscreen;

    tools.appendChild(faq);
    tools.appendChild(fullscreen);

    document.body.appendChild(tools);
}

function removeCornerTools() {

    document
        .querySelectorAll(".corner-tools")
        .forEach(e => e.remove());
}

/* ============================================================
   STATISTIK
   ============================================================ */

function createEmptyStats() {
    return {
        games: 0,
        wins: 0,
        totalPoints: 0,
        rounds: 0,
        zero: 0,
        par: 0,
        tvapar: 0,
        triss: 0,
        stege: 0,
        farg: 0,
        kak: 0,
        fyrtal: 0,
        fargstege: 0,
        royal: 0,
        chicago_plus: 0,
        chicago_minus: 0,
        outplay: 0,
        highestScore: 0,
        highestRound: 0
    };
}

function ensureStats(player) {

    if (!statistics[player]) {
        statistics[player] = createEmptyStats();
    }
}

/* ============================================================
   SOCKET EVENTS
   ============================================================ */

socket.on("connect", () => {

    connected = true;

    const savedRoom = localStorage.getItem("chicago_room");

    if (savedRoom) {

        roomCode = savedRoom.toUpperCase();

        socket.emit(
            "join_room",
            roomCode
        );

    } else {

        startScreen();
    }
});

socket.on("room_created", data => {

    if (!data || !data.roomCode) return;

    roomCode = data.roomCode;

    localStorage.setItem(
        "chicago_room",
        roomCode
    );

    hostId = data.hostId || socket.id;

    startScreen();
});

socket.on("room_joined", data => {

    if (!data || !data.roomCode) return;

    roomCode = data.roomCode;

    localStorage.setItem(
        "chicago_room",
        roomCode
    );

    hostId = data.hostId || null;

    socket.emit("get_state");
});

socket.on("room_error", message => {

    roomCode = null;

    localStorage.removeItem(
        "chicago_room"
    );

    hostId = null;

    startScreen();

    showBanner(
        "KUNDE INTE ANSLUTA",
        message || "Rummet finns inte längre."
    );
});

socket.on("action_error", message => {

    showBanner(
        "EJ TILLÅTET",
        message || "Åtgärden kunde inte genomföras."
    );
});

socket.on("no_room", () => {

    roomCode = null;
    hostId = null;

    localStorage.removeItem(
        "chicago_room"
    );

    startScreen();
});

socket.on("session_left", () => {

    roomCode = null;
    hostId = null;

    localStorage.removeItem(
        "chicago_room"
    );

    players = [];
    scores = {};
    currentRound = 0;
    activePlayerIndex = 0;
    gameStarted = false;
    gameFinished = false;
    statistics = {};
    previousWinner = null;

    startScreen();

    showBanner(
        "SESSION AVBRUTEN",
        "Du har lämnat spelet på den här enheten."
    );
});

socket.on("host_changed", data => {

    if (!data) return;

    hostId = data.newHostId || hostId;

    if (
        socket.id === data.newHostId
    ) {

        showBanner(
            "NY PROTOKOLLFÖRARE",
            `${data.newHostName || "Den tidigare protokollföraren"} har lämnat sessionen. Du är nu protokollförare.`,
            5000
        );
    }
});

socket.on("session_notice", data => {

    if (!data) return;

    showBanner(
        data.title || "INFORMATION",
        data.message || ""
    );
});

socket.on("disconnect", () => {

    connected = false;

    showBanner(
        "ANSLUTNINGEN FÖRSVANN",
        "Försöker ansluta igen. Spelet finns kvar på servern.",
        5000
    );

    if (currentScreen === "game") {
        gameScreen();
    } else if (currentScreen === "stats") {
        showStatistics();
    } else {
        startScreen();
    }
});

socket.on("game_state", state => {

    if (!state) return;

    roomCode =
        state.roomCode ||
        roomCode;

    if (roomCode) {
        localStorage.setItem(
            "chicago_room",
            roomCode
        );
    }

    players =
        Array.isArray(state.players)
            ? state.players
            : [];

    scores =
        state.scores || {};

    currentRound =
        Number(state.currentRound || 0);

    activePlayerIndex =
        Number(state.activePlayerIndex || 0);

    gameStarted =
        !!state.started;

    hostId =
        state.hostId || null;

    statistics =
        state.statistics || {};

    previousWinner =
        state.previousWinner || null;

    if (
        currentScreen === "stats" &&
        gameStarted
    ) {
        showStatistics();
        return;
    }

    if (gameStarted) {

        gameFinished = false;
        gameScreen();

    } else {

        startScreen();
    }
});

/* ============================================================
   SKICKA STATE
   ============================================================ */

function sendState() {

    if (!isHost()) {

        showBanner(
            "EJ PROTOKOLLFÖRARE",
            "Endast protokollföraren kan ändra spelet."
        );

        return;
    }

    socket.emit("update_state", {

        players,
        scores,
        currentRound,
        activePlayerIndex,

        started: players.length > 0,

        statistics,
        previousWinner
    });
}

/* ============================================================
   REGISTER PLAYER
   ============================================================ */

function registerCurrentPlayer(name) {

    if (!name) return;

    socket.emit(
        "register_player",
        name
    );
}

/* ============================================================
   TOTAL
   ============================================================ */

function calculateTotal(player) {

    let total = 0;

    const data = scores[player];

    if (!data) return 0;

    for (const round of data) {

        if (round?.s1) {
            total += Number(
                round.s1.total || 0
            );
        }

        if (round?.s2) {
            total += Number(
                round.s2.total || 0
            );
        }
    }

    return total;
}

/* ============================================================
   STARTA SPEL
   ============================================================ */

function startGame(names) {

    if (!isHost()) return;

    players = names.map(
        n => n.trim()
    );

    currentRound = 0;
    gameFinished = false;
    currentScreen = "game";
    scores = {};

    if (
        previousWinner &&
        players.includes(previousWinner)
    ) {

        activePlayerIndex =
            players.indexOf(previousWinner);

    } else {

        activePlayerIndex = 0;
    }

    for (const player of players) {

        scores[player] = [
            {
                s1: null,
                s2: null
            }
        ];

        ensureStats(player);

        statistics[player].games++;
    }

    registerCurrentPlayer(
        players[0]
    );

    sendState();
}

function startNewGameWithSamePlayers() {

    if (!isHost() || !players.length) {
        return;
    }

    currentRound = 0;
    gameFinished = false;
    currentScreen = "game";
    scores = {};

    if (
        previousWinner &&
        players.includes(previousWinner)
    ) {

        activePlayerIndex =
            players.indexOf(previousWinner);

    } else {

        activePlayerIndex = 0;
    }

    for (const player of players) {

        scores[player] = [
            {
                s1: null,
                s2: null
            }
        ];

        ensureStats(player);

        statistics[player].games++;
    }

    sendState();
}

function nextRound() {

    if (!isHost()) return;

    activePlayerIndex++;

    if (
        activePlayerIndex >= players.length
    ) {
        activePlayerIndex = 0;
    }

    currentRound++;

    for (const player of players) {

        if (!scores[player]) {
            scores[player] = [];
        }

        scores[player].push({
            s1: null,
            s2: null
        });
    }

    sendState();
}

/* ============================================================
   POÄNGPOPUP
   ============================================================ */

function openScorePopup(
    player,
    gameNumber
) {

    if (!isHost()) return;

    const roundData =
        scores[player][currentRound];

    const key =
        gameNumber === 0
            ? "s1"
            : "s2";

    let selectedBase =
        roundData[key]?.base || 0;

    let selectedOutplay =
        roundData[key]?.outplay || 0;

    let selectedCombination = null;

    const overlay =
        el(
            "div",
            "popup-overlay"
        );

    const popup =
        el(
            "div",
            "popup"
        );

    overlay.appendChild(popup);

    popup.appendChild(
        el(
            "div",
            "popup-title",
            `${player} — ${gameNumber === 0 ? "S1" : "S2"}`
        )
    );

    const grid =
        el(
            "div",
            "combination-grid"
        );

    const buttons = [];

    function updateSelection() {

        buttons.forEach(item => {

            item.button.classList.toggle(
                "selected",
                item.value === selectedBase
            );
        });
    }

    COMBINATIONS.forEach(
        ([name,value,keyName]) => {

            const btn =
                el(
                    "button",
                    "combination-btn",
                    name
                );

            btn.onclick = () => {

                selectedBase = value;
                selectedCombination = keyName;

                updateSelection();

                if (gameNumber === 0) {

                    saveScore(
                        player,
                        key,
                        selectedBase,
                        0,
                        selectedCombination
                    );

                    overlay.remove();

                    if (
                        name.startsWith(
                            "Royal Flush"
                        )
                    ) {
                        finishGame(
                            player,
                            "ROYAL FLUSH! 🎉"
                        );
                    }
                }
            };

            grid.appendChild(btn);

            buttons.push({
                button: btn,
                value
            });
        }
    );

    popup.appendChild(grid);

    if (gameNumber === 1) {

        const section =
            el(
                "div",
                "outplay-section"
            );

        const outplayBtn =
            el(
                "button",
                "outplay-btn",
                "+5 UTSPEL"
            );

        if (
            selectedOutplay === OUTPLAY_POINTS
        ) {
            outplayBtn.classList.add(
                "selected"
            );
        }

        outplayBtn.onclick = () => {

            selectedOutplay =
                selectedOutplay ===
                OUTPLAY_POINTS
                    ? 0
                    : OUTPLAY_POINTS;

            outplayBtn.classList.toggle(
                "selected",
                selectedOutplay > 0
            );
        };

        section.appendChild(outplayBtn);
        popup.appendChild(section);

        const actions =
            el(
                "div",
                "popup-buttons"
            );

        const saveBtn =
            el(
                "button",
                "popup-btn popup-btn-save",
                "KLAR"
            );

        saveBtn.onclick = () => {

            saveScore(
                player,
                key,
                selectedBase,
                selectedOutplay,
                selectedCombination
            );

            overlay.remove();

            const total =
                calculateTotal(player);

            if (
                total > 50 &&
                selectedOutplay > 0
            ) {
                finishGame(
                    player,
                    "ÖVER 50 POÄNG + UTSPEL! 🎉"
                );
            }
        };

        actions.appendChild(saveBtn);

        const cancelBtn =
            el(
                "button",
                "popup-btn popup-btn-cancel",
                "AVBRYT"
            );

        cancelBtn.onclick = () =>
            overlay.remove();

        actions.appendChild(cancelBtn);

        popup.appendChild(actions);
    }

    updateSelection();

    document.body.appendChild(
        overlay
    );
}

/* ============================================================
   SPARA POÄNG
   ============================================================ */

function saveScore(
    player,
    key,
    base,
    outplay,
    combinationKey
) {

    if (!scores[player]) return;

    const old =
        scores[player][currentRound]?.[key];

    const total =
        Number(base) +
        Number(outplay);

    scores[player][currentRound][key] = {
        base: Number(base),
        outplay: Number(outplay),
        total
    };

    ensureStats(player);

    if (
        combinationKey &&
        (!old || old.base !== base)
    ) {

        if (
            statistics[player][combinationKey] !==
            undefined
        ) {
            statistics[player][combinationKey]++;
        }
    }

    if (
        base === 15 &&
        (!old || old.base !== base)
    ) {
        statistics[player].chicago_plus++;
    }

    if (
        base === -15 &&
        (!old || old.base !== base)
    ) {
        statistics[player].chicago_minus++;
    }

    if (
        outplay > 0 &&
        (!old || old.outplay === 0)
    ) {
        statistics[player].outplay++;
    }

    sendState();

    if (
        currentScreen === "stats"
    ) {
        showStatistics();
    }
}

/* ============================================================
   AVSLUTA SPEL
   ============================================================ */

function finishGame(
    winner,
    reason
) {

    if (
        !isHost() ||
        gameFinished
    ) {
        return;
    }

    gameFinished = true;

    ensureStats(winner);

    statistics[winner].wins++;

    previousWinner = winner;

    for (
        const player of players
    ) {

        ensureStats(player);

        const total =
            calculateTotal(player);

        statistics[player].totalPoints +=
            total;

        statistics[player].rounds +=
            currentRound + 1;

        if (
            total >
            statistics[player].highestScore
        ) {
            statistics[player].highestScore =
                total;
        }

        if (
            total >
            statistics[player].highestRound
        ) {
            statistics[player].highestRound =
                total;
        }
    }

    sendState();

    showWinner(
        winner,
        reason
    );
}

/* ============================================================
   VINNARE
   ============================================================ */

function showWinner(
    player,
    reason
) {

    currentScreen = "winner";

    app.innerHTML = "";

    removeCornerTools();
    createCornerTools();

    const screen =
        el(
            "div",
            "screen winner-screen"
        );

    screen.appendChild(
        el(
            "div",
            "winner-title",
            "🏆 VINST! 🏆"
        )
    );

    screen.appendChild(
        el(
            "div",
            "winner-name",
            player
        )
    );

    screen.appendChild(
        el(
            "div",
            "winner-score",
            `${calculateTotal(player)} POÄNG`
        )
    );

    screen.appendChild(
        el(
            "div",
            "winner-message",
            reason
        )
    );

    const buttons =
        el(
            "div",
            "winner-buttons"
        );

    if (isHost()) {

        buttons.appendChild(
            button(
                "NYTT SPEL",
                "",
                () => {

                    if (
                        confirm(
                            "Starta ett nytt spel?\n\nSpelarnas namn behålls.\nAll statistik sparas."
                        )
                    ) {
                        startNewGameWithSamePlayers();
                    }
                }
            )
        );

        buttons.appendChild(
            button(
                "STATISTIK",
                "",
                showStatistics
            )
        );
    }

    screen.appendChild(buttons);
    app.appendChild(screen);

    createConfetti();
}

/* ============================================================
   CONFETTI
   ============================================================ */

function createConfetti() {

    const colors = [
        "#ff0000",
        "#ffd700",
        "#c9a84c",
        "#ffffff",
        "#cc0000"
    ];

    for (
        let i = 0;
        i < 100;
        i++
    ) {

        const piece =
            el(
                "div",
                "confetti"
            );

        piece.style.left =
            Math.random() * 100 +
            "vw";

        piece.style.backgroundColor =
            colors[
                Math.floor(
                    Math.random() *
                    colors.length
                )
            ];

        piece.style.animationDuration =
            (2 + Math.random() * 2.5) +
            "s";

        piece.style.animationDelay =
            (Math.random() * .8) +
            "s";

        document.body.appendChild(
            piece
        );

        setTimeout(
            () => piece.remove(),
            5000
        );
    }
}

/* ============================================================
   LIVE STATISTIK
   ============================================================ */

function getLiveStats(player) {

    ensureStats(player);

    const saved =
        statistics[player];

    const currentPoints =
        calculateTotal(player);

    const historicalPoints =
        Number(
            saved.totalPoints || 0
        );

    const games =
        Number(
            saved.games || 0
        );

    const liveTotal =
        gameStarted
            ? historicalPoints + currentPoints
            : historicalPoints;

    const liveAverage =
        games > 0
            ? Math.round(
                liveTotal / games
            )
            : 0;

    return {
        games,
        wins: Number(saved.wins || 0),
        totalPoints: liveTotal,
        average: liveAverage,
        currentPoints,
        rounds: Number(saved.rounds || 0),
        zero: Number(saved.zero || 0),
        par: Number(saved.par || 0),
        tvapar: Number(saved.tvapar || 0),
        triss: Number(saved.triss || 0),
        stege: Number(saved.stege || 0),
        farg: Number(saved.farg || 0),
        kak: Number(saved.kak || 0),
        fyrtal: Number(saved.fyrtal || 0),
        fargstege: Number(saved.fargstege || 0),
        royal: Number(saved.royal || 0),
        chicago_plus: Number(saved.chicago_plus || 0),
        chicago_minus: Number(saved.chicago_minus || 0),
        outplay: Number(saved.outplay || 0),
        highestScore:
            Number(
                saved.highestScore || 0
            )
    };
}

/* ============================================================
   STATISTIK
   ============================================================ */

function showStatistics() {

    currentScreen = "stats";

    app.innerHTML = "";

    removeCornerTools();
    createCornerTools();

    const screen =
        el(
            "div",
            "screen stats-screen"
        );

    screen.appendChild(
        el(
            "div",
            "stats-title",
            "STATISTIK"
        )
    );

    const subtitle =
        el(
            "div",
            "stats-subtitle",
            gameStarted
                ? "● LIVE — PÅGÅENDE SPEL"
                : "ALLA TIDIGARE SPEL"
        );

    if (gameStarted) {
        subtitle.style.color =
            "var(--gold)";
    }

    screen.appendChild(subtitle);

    const list =
        el(
            "div",
            "stats-list"
        );

    const names =
        Object.keys(statistics);

    if (!names.length) {

        list.appendChild(
            el(
                "div",
                "",
                "Ingen statistik ännu."
            )
        );

    } else {

        names.sort(
            (a,b) => {

                const aw =
                    statistics[a]?.wins || 0;

                const bw =
                    statistics[b]?.wins || 0;

                if (aw !== bw) {
                    return bw - aw;
                }

                return (
                    (statistics[b]?.totalPoints || 0) -
                    (statistics[a]?.totalPoints || 0)
                );
            }
        );

        for (
            const player of names
        ) {

            const data =
                getLiveStats(player);

            const card =
                el(
                    "div",
                    "stats-card"
                );

            card.appendChild(
                el(
                    "div",
                    "stats-player",
                    player
                )
            );

            const grid =
                el(
                    "div",
                    "stats-grid"
                );

            const stats = [
                [data.games,"Spel"],
                [data.wins,"Vinster"],
                [
                    data.games
                        ? Math.round(
                            data.wins /
                            data.games *
                            100
                        )
                        : 0,
                    "Vinst %"
                ],
                [data.totalPoints,"Totalpoäng",gameStarted],
                [data.average,"Snittpoäng",gameStarted],
                [data.highestScore,"Bästa resultat"],
                [data.rounds,"Omgångar"],
                [data.zero,"0 poäng"],
                [data.par,"Par"],
                [data.tvapar,"Två par"],
                [data.triss,"Triss"],
                [data.stege,"Stege"],
                [data.farg,"Färg"],
                [data.kak,"Kåk"],
                [data.fyrtal,"Fyrtal"],
                [data.fargstege,"Färgstege"],
                [data.royal,"Royal Flush"],
                [data.chicago_plus,"Chicago +15"],
                [data.chicago_minus,"Chicago -15"],
                [data.outplay,"Utspel"]
            ];

            if (gameStarted) {

                stats.push(
                    [
                        data.currentPoints,
                        "Nuvarande poäng",
                        true
                    ]
                );

                stats.push(
                    [
                        currentRound + 1,
                        "Pågående omgång",
                        true
                    ]
                );
            }

            stats.forEach(
                ([value,label,live]) => {

                    const box =
                        el(
                            "div",
                            `stat-box${live ? " live-stat" : ""}`
                        );

                    box.appendChild(
                        el(
                            "div",
                            "stat-number",
                            value
                        )
                    );

                    box.appendChild(
                        el(
                            "div",
                            "stat-label",
                            label
                        )
                    );

                    grid.appendChild(box);
                }
            );

            card.appendChild(grid);
            list.appendChild(card);
        }
    }

    screen.appendChild(list);

    const buttons =
        el(
            "div",
            "stats-buttons"
        );

    buttons.appendChild(
        button(
            gameStarted
                ? "TILLBAKA TILL SPELET"
                : "TILL START",
            "",
            () => {

                if (gameStarted) {
                    gameScreen();
                } else {
                    startScreen();
                }
            }
        )
    );

    screen.appendChild(buttons);

    app.appendChild(screen);
}

/* ============================================================
   START
   ============================================================ */

startScreen();

</script>
